[project]
name = "video-extensions"
version = "0.1.0"
description = "Check if a file or extension is a video type, and iterate over 36+ known video file formats. Python port of video-extensions npm package."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "ysskrishna", email = "sivasaikrishnassk@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed"
]
keywords = [
    "video",
    "extensions",
    "extension",
    "file",
    "file-extensions",
    "video-files",
    "file-type",
    "mime-type",
    "file-detection",
    "video-detection",
    "file-utils",
    "utilities",
    "utils",
    "mit license",
    "ysskrishna"
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.urls]
Homepage = "https://github.com/ysskrishna/video-extensions"
Repository = "https://github.com/ysskrishna/video-extensions.git"
Issues = "https://github.com/ysskrishna/video-extensions/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_extensions"]

